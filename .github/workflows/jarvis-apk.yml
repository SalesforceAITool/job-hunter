name: Jarvis APK

# Builds the Jarvis Android app (jarvis/, based on Mika) and uploads the APK.
# Download it from the run's "Artifacts" section, unzip, and install on the phone.
on:
  push:
    branches: [claude/personal-mobile-ai-assistant-u5xuvs]
    paths: ["jarvis/**", ".github/workflows/jarvis-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream Mika commit this copy is based on; its bundled runtime is too big to keep in this repo.
  MIKA_COMMIT: 1d1a3b4cc07808340c626a9062379ebed84126a3
  ROOTFS_SHA256: 87756a3797cb57b7c584cd6655650f88edf689df10a969648522e955d7043adf

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch bundled runtime from upstream Mika
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o app/src/main/assets/runtime/rootfs.tar.xz \
            "https://raw.githubusercontent.com/wangzan101/Mika/${MIKA_COMMIT}/app/src/main/assets/runtime/rootfs.tar.xz"
          echo "${ROOTFS_SHA256}  app/src/main/assets/runtime/rootfs.tar.xz" | sha256sum -c -
      - name: Use the fixed signing key (so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            mkdir -p ~/.android
            echo "${KEYSTORE_B64}" | base64 -d > ~/.android/debug.keystore
            echo "Using the JARVIS_DEBUG_KEYSTORE_B64 secret."
          else
            echo "::warning::No JARVIS_DEBUG_KEYSTORE_B64 secret: this APK has a one-off key, so the next build will not install as an update."
          fi
      - name: Unit tests and APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare download
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Jarvis-${GITHUB_SHA::7}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "## Jarvis APK"
            echo "Download the Jarvis artifact below, unzip it, and install the APK on the phone."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ github.sha }}
          path: jarvis/dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-test-reports-${{ github.sha }}
          path: |
            jarvis/core/build/reports/tests/
            jarvis/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
